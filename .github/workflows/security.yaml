# Scans dependencies with Trivy, using the same version (mise.toml) and config
# (trivy.yaml) as `vp run security` locally. Runs weekly too, for new advisories.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node (.node-version), Bun and Trivy at the versions in mise.toml.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5

      # The vp CLI at the version in package.json, using mise's Node and Bun.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-manager: false
          package-manager: false
          run-install: false

      # vp run reads vite.config.ts, which needs the dependencies installed.
      - run: vp install --frozen-lockfile
      - run: vp run security
