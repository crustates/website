# Checks, tests, builds and audits the site on every pull request. On pushes
# to main it also deploys the static output to GitHub Pages.
name: site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node (.node-version), Bun and Trivy at the versions in mise.toml.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5

      # The vp CLI at the version in package.json, using mise's Node and Bun.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-manager: false
          package-manager: false
          run-install: false

      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp exec playwright install --with-deps chromium
      - run: vp test
      - run: vp build

      # The built site, served like GitHub Pages: every page, links, JS off, 320px.
      - run: vp run e2e
      - name: JS weight per page
        run: |
          echo "### JavaScript per page" >> "$GITHUB_STEP_SUMMARY"
          vpx ./scripts/weight.ts >> "$GITHUB_STEP_SUMMARY"
      # Fails under 95 in any category; the scores go to the job summary.
      - run: vp run lighthouse
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouse/
          if-no-files-found: ignore
          include-hidden-files: true

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/client

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
